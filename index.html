<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:title" content="decompiler">
<link rel="icon" href="assets/favicon.ico">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="include/arm64.min.js"></script>
<script src="include/elf.min.js"></script>
<script src="include/decompiler.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/gas/gas.min.js"></script>
<style>
.CodeMirror { height:70vh; touch-action: manipulation; }
</style>
</head>
<body>
<input type="file" id="file"><br>
<button id="full" disabled>arm64</button>
<button id="clike" disabled>C</button>
<button id="copy" disabled>copy</button>
<hr style="border:0;border-top:1px solid #888;margin:8px 0">
<textarea id="out">-</textarea>
<hr style="border:0;border-top:1px solid #888;margin:8px 0">

<script>
var asmText = '', cText = '', cur = '';
var out = document.getElementById('out');
var editor = CodeMirror.fromTextArea(out, {
  mode: 'gas', readOnly: 'nocursor', lineNumbers: true, lineWrapping: true, viewportMargin: Infinity
});
var bC = document.getElementById('clike'), bF = document.getElementById('full'), bCopy = document.getElementById('copy');

function split(t) {
  var lines = t.split('\n'), asm = [], c = [], inC = false;
  for (var i = 0; i < lines.length; i++) {
    if (lines[i] === '--- --- decompile --- ---') { inC = true; continue; }
    if (/^=== .* @ .* ===$/.test(lines[i])) inC = false;
    (inC ? c : asm).push(lines[i]);
  }
  return { asm: asm.join('\n').replace(/\s+$/, ''), c: c.join('\n').replace(/^\s+|\s+$/g, '') };
}

function show(text, language) {
  cur = text;
  editor.setOption('mode', language === 'c' ? 'text/x-csrc' : 'gas');
  editor.setValue(text);
  editor.refresh();
}

var fileInput = document.getElementById('file');
function loadFile(f) {
  if (!f) return;
  editor.setValue('decompiling...');
  var r = new FileReader();
  r.onload = function () {
    setTimeout(function () {
      try {
        var t = decompile({ bytes: new Uint8Array(r.result), name: f.name, allFunctions: true, format: 'text' });
        var p = split(t);
        asmText = p.asm; cText = p.c;
        show(asmText);
        bC.disabled = bF.disabled = bCopy.disabled = false;
      } catch (err) {
        editor.setValue(String(err));
      }
    }, 20);
  };
  r.readAsArrayBuffer(f);
}

fileInput.onchange = function (e) { loadFile(e.target.files[0]); };
document.body.addEventListener('dragover', function (e) { e.preventDefault(); });
document.body.addEventListener('drop', function (e) {
  e.preventDefault();
  loadFile(e.dataTransfer.files[0]);
});
bC.onclick = function () { show(cText, 'c'); };
bF.onclick = function () { show(asmText, 'armasm'); };
bCopy.onclick = function () { navigator.clipboard.writeText(editor.getValue()); };
</script>
</body>
</html>
